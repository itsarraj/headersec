[package]
name = "headersec"
version = "0.1.0"
edition = "2021"
description = "Grade a live URL's HTTP response security headers from the command line"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/headersec"
readme = "README.md"
keywords = ["security", "http", "headers", "csp", "hsts"]
categories = ["command-line-utilities"]

[lib]
name = "headersec"
path = "src/lib.rs"

[[bin]]
name = "headersec"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
